name: Understory
description: 'Understory is an insurtech company headquartered in Madison, Wisconsin
  (founded 2012) that combines its own network of ground-truth Dot weather sensors
  with a proprietary weather risk model to underwrite parametric insurance against
  severe weather, including hail coverage for automotive dealership open lots and
  agricultural weather risk. Its UnderstoryOS platform covers broker management,
  pricing and quoting, and automated weather-triggered claims. Understory publishes
  no public API or developer portal; the platform is offered to insurance partners
  rather than as a self-service developer product.'
